<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>agent-takkub editor</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      height: 100%; width: 100%;
      background: #0e0e10;
      color: #e6e6e6;
      font-family: "Segoe UI", "Cascadia Mono", "Consolas", sans-serif;
      overflow: hidden;
    }
    #root { position: absolute; inset: 0; display: flex; flex-direction: column; }

    /* -- tab bar -- */
    #tabbar {
      display: flex; align-items: stretch; flex-wrap: nowrap; overflow-x: auto;
      background: #101216; border-bottom: 1px solid rgba(255,255,255,0.09);
      min-height: 32px; flex: 0 0 auto;
    }
    .tab {
      display: flex; align-items: center; gap: 6px;
      padding: 0 6px 0 10px; font-size: 12px; color: #c7ccd4;
      border-right: 1px solid rgba(255,255,255,0.06); cursor: pointer;
      white-space: nowrap; user-select: none;
    }
    .tab:hover { background: #181b21; }
    .tab.active { background: #191c22; color: #f2f3f5; box-shadow: inset 0 -2px 0 0 #E3B341; }
    .tab .name { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
    .tab .diff-toggle, .tab .close {
      border: none; background: transparent; color: #7b828f; cursor: pointer;
      font-size: 12px; line-height: 1; padding: 3px 4px; border-radius: 4px;
    }
    .tab .diff-toggle:hover, .tab .close:hover { background: rgba(255,255,255,0.12); color: #f2f3f5; }
    .tab .diff-toggle.on { color: #E3B341; }

    /* -- editor surfaces -- */
    #surface { position: relative; flex: 1 1 auto; }
    #monaco-code, #monaco-diff, #plain-view { position: absolute; inset: 0; }
    #plain-view {
      margin: 0; padding: 10px; overflow: auto; white-space: pre;
      font-family: "Cascadia Mono", "Consolas", monospace; font-size: 13px; line-height: 1.4;
    }
    #placeholder {
      position: absolute; inset: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px; color: #9aa0aa; font-size: 13px;
      text-align: center; padding: 24px;
    }
    #placeholder button {
      background: #232732; color: #e9ebef; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px; padding: 6px 14px; font-size: 12px; cursor: pointer;
    }
    #placeholder button:hover { background: #2a2f3c; }
    #empty-state {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #5b626e; font-size: 13px;
    }

    /* -- toast -- */
    #toast {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #232732; color: #f2f3f5; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px; padding: 8px 16px; font-size: 12px; opacity: 0; pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* -- disk-changed banner (per active tab) -- */
    #disk-banner {
      display: none; align-items: center; gap: 10px; flex: 0 0 auto;
      background: #422006; border-bottom: 1px solid #a16207; color: #fde047;
      font-size: 12px; padding: 6px 12px;
    }
    #disk-banner span { flex: 1 1 auto; }
    #disk-banner button {
      background: transparent; color: #fde047; border: 1px solid rgba(253,224,71,0.4);
      border-radius: 5px; padding: 3px 10px; font-size: 11px; cursor: pointer;
    }
    #disk-banner button:hover { background: rgba(253,224,71,0.12); }

    /* -- modals: ask-agent / conflict -- */
    .modal-overlay {
      display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.5);
      align-items: center; justify-content: center; z-index: 50;
    }
    .modal-box {
      background: #1c1f26; border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
      padding: 16px; width: 420px; max-width: 90%; box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    .modal-box .modal-title { font-size: 13px; color: #f2f3f5; margin-bottom: 8px; font-weight: 600; }
    .modal-box .modal-context { font-size: 11px; color: #9aa0aa; margin-bottom: 8px; }
    .modal-box textarea {
      width: 100%; box-sizing: border-box; background: #101216; color: #e6e6e6;
      border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; padding: 8px;
      font-size: 13px; font-family: inherit; resize: vertical;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .modal-actions button {
      background: #232732; color: #e9ebef; border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px; padding: 6px 14px; font-size: 12px; cursor: pointer;
    }
    .modal-actions button:hover { background: #2a2f3c; }
    .modal-actions button.primary { background: #E3B341; color: #241a00; border-color: #E3B341; }
    .modal-actions button.primary:hover { background: #eec25a; }
  </style>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <!-- Bundled locally per 04_MONACO_EDITOR_SPEC.md ("bundle Monaco locally;
       no production CDN dependency"). Vendored by devops packaging
       (docs/plans/2026-08-23-master-dev-plan.md §4 phase 2) into
       static/editor/vendor/monaco-editor/min/vs/. Loaded dynamically below
       (not a static <script> tag) so a missing bundle degrades to the
       plain read-only viewer instead of a hard page-load failure. -->
</head>
<body>
  <div id="root">
    <div id="tabbar"></div>
    <div id="disk-banner">
      <span id="disk-banner-text"></span>
      <button id="disk-banner-reload">Reload disk</button>
      <button id="disk-banner-dismiss">Dismiss</button>
    </div>
    <div id="surface">
      <div id="monaco-code"></div>
      <div id="monaco-diff" style="display:none;"></div>
      <pre id="plain-view" style="display:none;"></pre>
      <div id="placeholder"></div>
      <div id="empty-state">Open a file from the Explorer to get started.</div>
    </div>
  </div>
  <div id="toast"></div>

  <!-- Ask Agent — bounded selection + free-text request, sent via
       bridge.askAgent (Python forwards it to Lead through the existing
       takkub-send IPC, never the whole file — 05_GIT_DIFF_AND_AGENT_CHANGES.md). -->
  <div id="ask-agent-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">Ask Agent</div>
      <div class="modal-context" id="ask-agent-context"></div>
      <textarea id="ask-agent-input" rows="3" placeholder="What should the agent do with this selection?"></textarea>
      <div class="modal-actions">
        <button id="ask-agent-cancel">Cancel</button>
        <button id="ask-agent-send" class="primary">Send</button>
      </div>
    </div>
  </div>

  <!-- Save conflict — disk moved since this file was loaded/last saved.
       04_MONACO_EDITOR_SPEC.md conflict rule: never overwrite silently. -->
  <div id="conflict-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">File changed on disk</div>
      <div class="modal-context" id="conflict-message"></div>
      <div class="modal-actions">
        <button id="conflict-cancel">Cancel</button>
        <button id="conflict-compare">Compare</button>
        <button id="conflict-reload">Reload disk</button>
        <button id="conflict-keep-mine" class="primary">Keep mine</button>
      </div>
    </div>
  </div>

  <script>
    'use strict';

    // ------------------------------------------------------------------
    // Qt bridge
    // ------------------------------------------------------------------
    let bridge = null;
    new QWebChannel(qt.webChannelTransport, (channel) => {
      bridge = channel.objects.bridge;
      if (bridge && bridge.ready) bridge.ready();
    });

    // ------------------------------------------------------------------
    // toast (Ctrl+S read-only notice, diff-unavailable notice, ...)
    // ------------------------------------------------------------------
    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
    }

    // ------------------------------------------------------------------
    // tab state — one entry per open path. `monacoAvailable` decides
    // whether tabs render through Monaco models or the plain <pre> fallback.
    // ------------------------------------------------------------------
    let monacoAvailable = false;
    let codeEditor = null;   // monaco.editor.IStandaloneCodeEditor
    let diffEditor = null;   // monaco.editor.IStandaloneDiffEditor

    // path -> { kind: 'code'|'unavailable', text, languageHint, reason, size,
    //           model, viewMode: 'source'|'diff', diffModels: {original, modified}|null,
    //           dirty, diskChanged, diskRemoved }
    // `diffModels.modified` is EITHER a fresh model (git-HEAD diff, via
    // editorShowDiff) OR `tab.model` itself (conflict "Compare", so the
    // diff reflects live edits) — disposeDiffModels() below knows not to
    // double-dispose the shared case. Only one diffModels pair exists per
    // tab at a time; the two flows never coexist (see toggleDiff/Compare).
    const tabs = new Map();
    let activePath = null;
    let askAgentSelection = null;
    let askAgentTargetPath = null;
    let conflictPath = null;

    const LANG_BY_EXT = {
      js: 'javascript', jsx: 'javascript', mjs: 'javascript', cjs: 'javascript',
      ts: 'typescript', tsx: 'typescript',
      py: 'python', pyw: 'python',
      json: 'json', jsonc: 'json',
      md: 'markdown', markdown: 'markdown',
      html: 'html', htm: 'html',
      css: 'css', scss: 'scss', less: 'less',
      yml: 'yaml', yaml: 'yaml',
      sh: 'shell', bash: 'shell', zsh: 'shell',
      ps1: 'powershell', psm1: 'powershell',
      rs: 'rust', go: 'go',
      java: 'java', kt: 'kotlin',
      c: 'c', h: 'c', cpp: 'cpp', hpp: 'cpp', cc: 'cpp',
      cs: 'csharp', rb: 'ruby', php: 'php',
      sql: 'sql', xml: 'xml', toml: 'ini', ini: 'ini', cfg: 'ini',
      dockerfile: 'dockerfile', txt: 'plaintext',
    };
    function languageFor(hint) {
      return LANG_BY_EXT[(hint || '').toLowerCase()] || 'plaintext';
    }
    function baseName(p) {
      const norm = (p || '').replace(/\\/g, '/');
      const parts = norm.split('/');
      return parts[parts.length - 1] || norm;
    }

    // ------------------------------------------------------------------
    // Monaco bootstrap — AMD loader from the local vendor bundle. Falls
    // back to the plain <pre> viewer if the bundle isn't present (devops
    // hasn't vendored it yet) or fails to initialize within the timeout.
    // ------------------------------------------------------------------
    function initMonaco(onDone) {
      const loader = document.createElement('script');
      loader.src = 'vendor/monaco-editor/min/vs/loader.js';
      let settled = false;
      const finish = (ok) => {
        if (settled) return;
        settled = true;
        onDone(ok);
      };
      loader.onerror = () => finish(false);
      loader.onload = () => {
        try {
          window.require.config({ paths: { vs: 'vendor/monaco-editor/min/vs' } });
          window.require(['vs/editor/editor.main'], () => finish(true), () => finish(false));
        } catch (e) {
          finish(false);
        }
      };
      document.head.appendChild(loader);
      setTimeout(() => finish(false), 4000);
    }

    initMonaco((ok) => {
      monacoAvailable = ok;
      if (ok) {
        codeEditor = monaco.editor.create(document.getElementById('monaco-code'), {
          readOnly: false,
          automaticLayout: true,
          minimap: { enabled: false },
          theme: 'vs-dark',
          fontSize: 13,
          scrollBeyondLastLine: false,
        });
        // Diff view stays read-only — edits happen in the source tab only,
        // the diff surface is for comparison (git-HEAD or a save conflict).
        diffEditor = monaco.editor.createDiffEditor(document.getElementById('monaco-diff'), {
          readOnly: true,
          automaticLayout: true,
          renderSideBySide: true,
          theme: 'vs-dark',
          fontSize: 13,
        });
        codeEditor.addAction({
          id: 'takkub-ask-agent',
          label: 'Ask Agent…',
          contextMenuGroupId: 'navigation',
          contextMenuOrder: 1.5,
          run: () => { if (activePath) openAskAgentModal(activePath); },
        });
      } else {
        document.getElementById('monaco-code').style.display = 'none';
        document.getElementById('monaco-diff').style.display = 'none';
      }
    });

    // Called from Python (EditorHost._EditorWebView.focus()) whenever
    // Qt-level widget focus lands on the WebView — a click reaching the
    // QWebEngineView does NOT by itself move Chromium's DOM focus into
    // Monaco's own hidden input target, so without this the cursor never
    // blinks and keystrokes go nowhere even though the widget itself
    // reports hasFocus() == true.
    function focusActiveEditor() {
      if (!monacoAvailable) return;
      const tab = tabs.get(activePath);
      if (!tab || tab.kind !== 'code') return;
      if (tab.viewMode === 'diff' && diffEditor) {
        diffEditor.getModifiedEditor().focus();
      } else if (codeEditor) {
        codeEditor.focus();
      }
    }
    window.focusActiveEditor = focusActiveEditor;

    function saveActiveTab() {
      const tab = tabs.get(activePath);
      if (!tab || tab.kind !== 'code') return;
      if (!monacoAvailable) {
        showToast('Editing needs the Monaco bundle (not installed).');
        return;
      }
      const text = tab.model.getValue();
      if (bridge) bridge.saveFile(tab.path, text);
    }

    // Capture phase so Ctrl+S is caught regardless of which element has
    // focus (editor, tab bar, a modal input) — stopPropagation keeps
    // Monaco's own internal Ctrl+S handling from also firing for the same
    // keystroke.
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
        e.preventDefault();
        e.stopPropagation();
        saveActiveTab();
      }
    }, true);

    // ------------------------------------------------------------------
    // tab bar rendering
    // ------------------------------------------------------------------
    function renderTabBar() {
      const bar = document.getElementById('tabbar');
      bar.innerHTML = '';
      for (const [path, tab] of tabs) {
        const el = document.createElement('div');
        el.className = 'tab' + (path === activePath ? ' active' : '');
        el.title = path;
        el.addEventListener('click', () => activateTab(path));

        const name = document.createElement('span');
        name.className = 'name';
        let label = baseName(path);
        if (tab.dirty) label = '● ' + label; // ● unsaved changes
        if (tab.diskChanged) label = label + ' ⚠'; // ⚠ changed/removed on disk
        name.textContent = label;
        el.appendChild(name);

        if (tab.kind === 'code') {
          const askBtn = document.createElement('button');
          askBtn.className = 'diff-toggle';
          askBtn.textContent = '?';
          askBtn.title = 'Ask Agent about this file/selection';
          askBtn.addEventListener('click', (ev) => { ev.stopPropagation(); openAskAgentModal(path); });
          el.appendChild(askBtn);

          const diffBtn = document.createElement('button');
          diffBtn.className = 'diff-toggle' + (tab.viewMode === 'diff' ? ' on' : '');
          diffBtn.textContent = '±';
          diffBtn.title = 'Diff vs HEAD';
          diffBtn.addEventListener('click', (ev) => { ev.stopPropagation(); toggleDiff(path); });
          el.appendChild(diffBtn);
        }

        const closeBtn = document.createElement('button');
        closeBtn.className = 'close';
        closeBtn.textContent = '×';
        closeBtn.title = 'Close';
        closeBtn.addEventListener('click', (ev) => { ev.stopPropagation(); closeTab(path); });
        el.appendChild(closeBtn);

        bar.appendChild(el);
      }
    }

    function hideAllSurfaces() {
      document.getElementById('monaco-code').style.display = 'none';
      document.getElementById('monaco-diff').style.display = 'none';
      document.getElementById('plain-view').style.display = 'none';
      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('empty-state').style.display = 'none';
    }

    function activateTab(path) {
      const tab = tabs.get(path);
      if (!tab) return;
      activePath = path;
      hideAllSurfaces();

      if (tab.kind === 'unavailable') {
        renderPlaceholder(tab);
        renderTabBar();
        return;
      }

      // kind === 'code'
      if (tab.viewMode === 'diff' && tab.diffModels) {
        if (monacoAvailable) {
          document.getElementById('monaco-diff').style.display = '';
          diffEditor.setModel(tab.diffModels);
        } else {
          renderPlainDiffFallback(tab);
        }
      } else if (monacoAvailable) {
        document.getElementById('monaco-code').style.display = '';
        codeEditor.setModel(tab.model);
      } else {
        const pre = document.getElementById('plain-view');
        pre.style.display = '';
        pre.textContent = tab.text;
      }
      renderTabBar();
      renderDiskBanner();
    }

    // ------------------------------------------------------------------
    // disk-changed banner (per active tab — set by editorDiskChanged/
    // editorDiskRemoved, cleared by editorReloadDisk or a manual dismiss)
    // ------------------------------------------------------------------
    function renderDiskBanner() {
      const tab = tabs.get(activePath);
      const banner = document.getElementById('disk-banner');
      if (!tab || !tab.diskChanged) {
        banner.style.display = 'none';
        return;
      }
      let msg = tab.diskRemoved
        ? `${baseName(activePath)} was deleted on disk.`
        : `${baseName(activePath)} changed on disk.`;
      if (tab.dirty) msg += ' You have unsaved edits — saving will still check for conflicts.';
      document.getElementById('disk-banner-text').textContent = msg;
      banner.style.display = 'flex';
    }

    function clearDiskChangedBanner(path) {
      const tab = tabs.get(path);
      if (!tab) return;
      tab.diskChanged = false;
      tab.diskRemoved = false;
      if (path === activePath) renderDiskBanner();
      renderTabBar();
    }

    document.getElementById('disk-banner-reload').addEventListener('click', () => {
      if (bridge && activePath) bridge.reloadFromDisk(activePath);
    });
    document.getElementById('disk-banner-dismiss').addEventListener('click', () => {
      if (activePath) clearDiskChangedBanner(activePath);
    });

    function renderPlaceholder(tab) {
      const ph = document.getElementById('placeholder');
      ph.style.display = 'flex';
      ph.innerHTML = '';
      const msg = document.createElement('div');
      const reasonText = tab.reason === 'binary' ? 'Binary file' : 'File too large to preview';
      msg.textContent = `${reasonText} (${formatSize(tab.size)}) — ${baseName(tab.path)}`;
      ph.appendChild(msg);
      const row = document.createElement('div');
      row.style.display = 'flex';
      row.style.gap = '8px';
      const openBtn = document.createElement('button');
      openBtn.textContent = 'Open externally';
      openBtn.addEventListener('click', () => { if (bridge) bridge.openExternally(tab.path); });
      const revealBtn = document.createElement('button');
      revealBtn.textContent = 'Reveal';
      revealBtn.addEventListener('click', () => { if (bridge) bridge.revealInExplorer(tab.path); });
      row.appendChild(openBtn);
      row.appendChild(revealBtn);
      ph.appendChild(row);
    }

    function renderPlainDiffFallback(tab) {
      const pre = document.getElementById('plain-view');
      pre.style.display = '';
      pre.textContent = 'Diff view needs the Monaco bundle (not installed) — showing current file instead.\n\n' + tab.text;
    }

    function formatSize(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    // ------------------------------------------------------------------
    // Python → JS API (called via runJavaScript)
    // ------------------------------------------------------------------
    window.editorOpenFile = function (path, text, languageHint) {
      let tab = tabs.get(path);
      if (!tab) {
        tab = {
          kind: 'code', path, text, languageHint, viewMode: 'source', diffModels: null, model: null,
          dirty: false, diskChanged: false, diskRemoved: false, pendingConflictDiskText: null,
        };
        if (monacoAvailable) {
          tab.model = monaco.editor.createModel(text, languageFor(languageHint), monaco.Uri.file(path));
          tab.model.onDidChangeContent(() => {
            tab.dirty = true;
            renderTabBar();
          });
        }
        tabs.set(path, tab);
      } else {
        tab.text = text; // reopen with fresh content
        tab.dirty = false;
        tab.diskChanged = false;
        tab.diskRemoved = false;
        if (monacoAvailable && tab.model) tab.model.setValue(text);
      }
      activateTab(path);
    };

    window.editorOpenUnavailable = function (path, reason, size) {
      let tab = tabs.get(path);
      if (!tab) {
        tab = { kind: 'unavailable', path, reason, size };
        tabs.set(path, tab);
      } else {
        tab.kind = 'unavailable';
        tab.reason = reason;
        tab.size = size;
      }
      activateTab(path);
    };

    window.editorShowDiff = function (path, originalText, modifiedText) {
      const tab = tabs.get(path);
      if (!tab || tab.kind !== 'code') return;
      if (monacoAvailable) {
        // A diffModels pair whose `modified` IS tab.model came from a
        // conflict "Compare" (see disposeDiffModels) — stale for a
        // git-HEAD diff, and reusing it would overwrite the live buffer
        // via setValue. Dispose and rebuild in that case.
        if (tab.diffModels && tab.diffModels.modified !== tab.model) {
          tab.diffModels.original.setValue(originalText);
          tab.diffModels.modified.setValue(modifiedText);
        } else {
          disposeDiffModels(tab);
          tab.diffModels = {
            original: monaco.editor.createModel(originalText, languageFor(tab.languageHint)),
            modified: monaco.editor.createModel(modifiedText, languageFor(tab.languageHint)),
          };
        }
      }
      tab.viewMode = 'diff';
      if (path === activePath) activateTab(path);
      else renderTabBar();
    };

    window.editorDiffFailed = function (path, _reason) {
      showToast(`Diff unavailable for ${baseName(path)}.`);
    };

    // ------------------------------------------------------------------
    // save / conflict / disk-change — Python -> JS (#365 phase 3)
    // ------------------------------------------------------------------
    window.editorSaveResult = function (path, ok, error) {
      const tab = tabs.get(path);
      if (!tab) return;
      if (ok) {
        tab.dirty = false;
        showToast(`Saved ${baseName(path)}`);
      } else {
        showToast(`Save failed: ${error || 'unknown error'}`);
      }
      renderTabBar();
    };

    window.editorConflict = function (path, diskText) {
      const tab = tabs.get(path);
      if (!tab) return;
      tab.pendingConflictDiskText = diskText;
      showConflictDialog(path);
    };

    window.editorReloadDisk = function (path, text) {
      const tab = tabs.get(path);
      if (!tab || tab.kind !== 'code') return;
      tab.text = text;
      tab.dirty = false;
      if (monacoAvailable && tab.model) tab.model.setValue(text);
      disposeDiffModels(tab);
      tab.viewMode = 'source';
      clearDiskChangedBanner(path);
      if (path === activePath) activateTab(path);
      else renderTabBar();
      showToast(`Reloaded ${baseName(path)} from disk`);
    };

    window.editorDiskChanged = function (path) {
      const tab = tabs.get(path);
      if (!tab) return;
      tab.diskChanged = true;
      tab.diskRemoved = false;
      renderTabBar();
      if (path === activePath) renderDiskBanner();
    };

    window.editorDiskRemoved = function (path) {
      const tab = tabs.get(path);
      if (!tab) return;
      tab.diskChanged = true;
      tab.diskRemoved = true;
      renderTabBar();
      if (path === activePath) renderDiskBanner();
    };

    // ------------------------------------------------------------------
    // tab interactions
    // ------------------------------------------------------------------
    function disposeDiffModels(tab) {
      if (!tab.diffModels) return;
      tab.diffModels.original.dispose();
      if (tab.diffModels.modified !== tab.model) tab.diffModels.modified.dispose();
      tab.diffModels = null;
    }

    function toggleDiff(path) {
      const tab = tabs.get(path);
      if (!tab || tab.kind !== 'code') return;
      if (tab.viewMode === 'diff') {
        tab.viewMode = 'source';
        activateTab(path);
        return;
      }
      // A diffModels pair left over from a conflict "Compare" is stale for
      // the git-HEAD diff — drop it and re-fetch rather than showing the
      // wrong comparison.
      if (tab.diffModels && tab.diffModels.modified === tab.model) {
        disposeDiffModels(tab);
      }
      if (tab.diffModels) {
        tab.viewMode = 'diff';
        activateTab(path);
        return;
      }
      if (bridge) bridge.requestDiff(path); // response arrives via editorShowDiff
    }

    function closeTab(path) {
      const tab = tabs.get(path);
      if (!tab) return;
      disposeDiffModels(tab);
      if (tab.model) tab.model.dispose();
      tabs.delete(path);
      if (activePath === path) {
        activePath = null;
        const remaining = Array.from(tabs.keys());
        if (remaining.length) {
          activateTab(remaining[remaining.length - 1]);
        } else {
          hideAllSurfaces();
          document.getElementById('empty-state').style.display = 'flex';
          renderTabBar();
        }
      } else {
        renderTabBar();
      }
      if (bridge) bridge.notifyTabClosed(path);
    }

    // ------------------------------------------------------------------
    // save conflict dialog: [Compare] [Reload disk] [Keep mine] [Cancel]
    // ------------------------------------------------------------------
    function showConflictDialog(path) {
      conflictPath = path;
      document.getElementById('conflict-message').textContent =
        `${baseName(path)} changed on disk since you opened it. Your edits are still here.`;
      document.getElementById('conflict-modal').style.display = 'flex';
    }

    function hideConflictDialog() {
      document.getElementById('conflict-modal').style.display = 'none';
      conflictPath = null;
    }

    document.getElementById('conflict-cancel').addEventListener('click', hideConflictDialog);

    document.getElementById('conflict-compare').addEventListener('click', () => {
      const tab = tabs.get(conflictPath);
      if (tab && monacoAvailable) {
        disposeDiffModels(tab);
        const diskText = tab.pendingConflictDiskText || '';
        // `modified` is tab.model itself (not a copy) so the diff reflects
        // live edits as the user keeps typing — see the tabs Map comment.
        tab.diffModels = {
          original: monaco.editor.createModel(diskText, languageFor(tab.languageHint)),
          modified: tab.model,
        };
        tab.viewMode = 'diff';
        activateTab(tab.path);
      }
      hideConflictDialog();
    });

    document.getElementById('conflict-reload').addEventListener('click', () => {
      if (bridge && conflictPath) bridge.reloadFromDisk(conflictPath);
      hideConflictDialog();
    });

    document.getElementById('conflict-keep-mine').addEventListener('click', () => {
      const tab = tabs.get(conflictPath);
      if (tab && bridge) {
        const text = monacoAvailable && tab.model ? tab.model.getValue() : tab.text;
        bridge.keepMineSave(tab.path, text);
      }
      hideConflictDialog();
    });

    // ------------------------------------------------------------------
    // Ask Agent: bounded selection (or none) + free-text request
    // ------------------------------------------------------------------
    function currentSelectionInfo() {
      const tab = tabs.get(activePath);
      if (!tab || tab.kind !== 'code' || !monacoAvailable) return null;
      const editorRef = (tab.viewMode === 'diff' && diffEditor)
        ? diffEditor.getModifiedEditor()
        : codeEditor;
      const sel = editorRef.getSelection();
      const model = editorRef.getModel();
      if (!sel || !model) return null;
      const text = model.getValueInRange(sel).slice(0, 4000); // bounded — never the whole file
      return { startLine: sel.startLineNumber, endLine: sel.endLineNumber, text };
    }

    function openAskAgentModal(path) {
      if (path !== activePath) activateTab(path);
      const info = currentSelectionInfo();
      document.getElementById('ask-agent-context').textContent = info
        ? `${baseName(path)} — lines ${info.startLine}-${info.endLine}`
        : `${baseName(path)} — no selection`;
      askAgentSelection = info;
      askAgentTargetPath = path;
      const input = document.getElementById('ask-agent-input');
      input.value = '';
      document.getElementById('ask-agent-modal').style.display = 'flex';
      input.focus();
    }

    function closeAskAgentModal() {
      document.getElementById('ask-agent-modal').style.display = 'none';
      askAgentSelection = null;
      askAgentTargetPath = null;
    }

    document.getElementById('ask-agent-cancel').addEventListener('click', closeAskAgentModal);
    document.getElementById('ask-agent-send').addEventListener('click', () => {
      const request = document.getElementById('ask-agent-input').value.trim();
      if (!request || !askAgentTargetPath || !bridge) {
        closeAskAgentModal();
        return;
      }
      const sel = askAgentSelection || { startLine: 1, endLine: 1, text: '' };
      bridge.askAgent(askAgentTargetPath, sel.startLine, sel.endLine, sel.text, request);
      closeAskAgentModal();
      showToast('Sent to agent.');
    });
  </script>
</body>
</html>
