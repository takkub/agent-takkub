repos:
  # gitleaks: block secrets (API keys, tokens, private keys) before they ever
  # land in a commit. Mirrors the CI `security` workflow's hard gate locally.
  # Bump with: pre-commit autoupdate.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # ruff: lint + format (matches pyproject.toml [tool.ruff] config).
  # rev must match pyproject.toml's dev-dependency ruff==X pin exactly —
  # enforced by tests/test_version_sync.py::test_ruff_pin_matches_pre_commit_rev.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # takkub docs-verify: block doc-drift before it reaches main
  - repo: local
    hooks:
      - id: takkub-docs-verify
        name: takkub docs-verify
        language: system
        # exclude planning/spec docs that deliberately reference future files.
        # Skipped inside a LINKED WORKTREE (#81): gitignored runtime/ artifacts
        # the docs reference don't exist there, so refs break spuriously; the
        # Lead's merge commit in the main tree re-runs the full check.
        entry: >-
          bash -c '
          if [ "$(git rev-parse --git-dir)" != "$(git rev-parse --git-common-dir)" ]; then
          echo "[worktree] docs-verify skipped (runtime/ absent here; re-runs on merge in main)"; exit 0; fi;
          takkub docs-verify --exit-on-broken
          --exclude "docs/MACOS_PORT_PLAN.md"
          --exclude "docs/superpowers/plans/*.md"
          --exclude "docs/superpowers/specs/*.md"
          --exclude "docs/code-review*/*.md"
          --exclude "docs/code-review-*.md"
          --exclude "docs/qa-reports/*.md"
          --exclude "docs/guides/*.md"
          --exclude "docs/audit/*.md"
          --exclude "docs/v2/*.md"
          --exclude "docs/plans/2026-08-23-master-dev-plan.md"
          --exclude "docs/plans/workspace-1.2.0-design/*.md"
          --exclude "docs/plans/workspace-1.2.0-design/examples/*.md"
          '
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # import-linter: architecture guardrail contracts
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter architecture contracts
        language: system
        # bash -c wrapper: `language: system` can't resolve the relative .exe on
        # Windows during commit (WinError 2); the same pattern works for depgraph-fresh.
        # .venv resolves from the MAIN worktree root (git-common-dir) so the hook
        # also works inside per-pane linked worktrees (#81), which have no .venv —
        # but that shared venv's editable install (a plain .pth sys.path entry) is
        # baked to the MAIN worktree's src/, so a linked worktree's own new modules
        # (added there, not yet merged) are invisible to it. PYTHONPATH is prepended
        # with THIS checkout's src/ (git-dir, not git-common-dir) so Python resolves
        # agent_takkub from wherever the hook is actually running — a no-op in the
        # main worktree (cwd's src == the .pth target already) and the fix for a
        # linked worktree.
        # BIN/EXT probe: venv layout is Scripts/*.exe on Windows, bin/* (no
        # extension) on macOS/Linux — detect which one exists instead of
        # hardcoding either (macOS panes were previously getting a
        # nonexistent-path failure here since Scripts/ was hardcoded).
        entry: >-
          bash -c '
          ROOT="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")";
          if [ -d "$ROOT/.venv/Scripts" ]; then BIN="$ROOT/.venv/Scripts"; EXT=".exe"; else BIN="$ROOT/.venv/bin"; EXT=""; fi;
          PYTHONPATH="$(pwd)/src" "$BIN/lint-imports$EXT"
          '
        pass_filenames: false
        stages: [pre-commit]

  # depgraph freshness: regenerate in memory and compare, no working-tree write
  - repo: local
    hooks:
      - id: depgraph-fresh
        name: depgraph freshness check
        language: system
        # See import-linter hook above for why PYTHONPATH is prepended with this
        # checkout's own src/ — same shared-venv/linked-worktree module-visibility
        # gap, same fix. Same Scripts/ vs bin/ BIN/EXT probe as import-linter above.
        # --check (see tools/gen_import_graph.py) compares in memory and ignores
        # the provenance-only generated_by field, so it never writes the file and
        # never false-positives on git-diff/CRLF flicker or a grimp point bump —
        # same code path CI's Depgraph freshness check step uses.
        entry: >-
          bash -c '
          ROOT="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")";
          if [ -d "$ROOT/.venv/Scripts" ]; then BIN="$ROOT/.venv/Scripts"; EXT=".exe"; else BIN="$ROOT/.venv/bin"; EXT=""; fi;
          PYTHONPATH="$(pwd)/src" "$BIN/python$EXT" tools/gen_import_graph.py --check
          '
        pass_filenames: false
        stages: [pre-commit]
