version: 2
# Automated dependency + GitHub Actions updates. Grouped and weekly to keep the
# PR volume sane for a solo maintainer. Security updates from GitHub's advisory
# database are opened regardless of schedule.
updates:
  # Python cockpit deps (pyproject.toml).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    groups:
      python-deps:
        patterns: ["*"]
    # PyQt6 is pinned to the 6.8 LTS series on purpose (matches `takkub doctor`'s
    # supported-Qt-series check, enforced by
    # tests/test_version_sync.py::test_qt_dependencies_match_doctor_supported_lts_series).
    # Block dependabot from proposing a minor/major bump past 6.9 (PR #138 tried
    # this and broke CI); patch-level security updates within 6.8.x still land.
    ignore:
      - dependency-name: "PyQt6"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "PyQt6-Qt6"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "PyQt6-WebEngine"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "PyQt6-WebEngine-Qt6"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # npm wrapper (root package.json — dev/wrapper only, zero runtime deps).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "npm"]

  # VS Code extension dev deps.
  - package-ecosystem: "npm"
    directory: "/vscode-extension"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "vscode-extension"]
    groups:
      vscode-ext-deps:
        patterns: ["*"]

  # Pin/refresh the actions used in CI (supply-chain hygiene).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
